# 구성원과 연구 페이지 목록은 여기 한 곳에서만 관리한다.
# 아래 네 개의 Publications 항목이 YAML 앵커로 이 목록을 함께 쓴다.
# 학생이 들어오거나 연구 페이지가 생기면 이 목록에만 추가하면 된다.
_lab_members: &LAB_MEMBERS
  - value: doyeon
    label: "이도연"
  - value: inseob
    label: "김인섭"
  - value: jiyoung
    label: "김지영"
  - value: sangmin
    label: "이상민"
  - value: junghyun
    label: "조정현"
  - value: jaeuk
    label: "백재욱"
  - value: jiung
    label: "한지웅"
  - value: jungyun
    label: "황정윤"
  - value: jisu
    label: "임지수"
  - value: hyunsu
    label: "이현수"
  - value: seyeon
    label: "김세연"
  - value: junho
    label: "송준호"
  - value: kyungjae
    label: "이경재 (졸업)"

_research_pages: &RESEARCH_PAGES
  - value: research-ai
    label: "이미지·벡터 하이브리드 기반 CAD 도면 공간 자동 인식 엔진 및 LLM 기반 자연어 질의응답"
  - value: research-cascade-hp
    label: "건물 내 동시 냉방·급탕 수요의 열적 결합을 통한 캐스케이드 히트펌프 시스템"
  - value: research-chpwh
    label: "공동주택 중앙식 히트펌프 급탕 시스템의 반환수 영향 저감을 위한 부하 분리와 적응형 Load "
  - value: research-da-apt-eui
    label: "아파트·주상복합 EUI 비교 분석"
  - value: research-da-eui-framework
    label: "업종별 EUI 도출 프레임워크"
  - value: research-da-green-retrofit
    label: "에너지 시그니처를 활용한 그린 리모델링 효과 분석"
  - value: research-da-preprocessing
    label: "로지스틱 맵 이미지 암호화 기법을 적용한 딥러닝 기반 재실자 감지 시스템 제안"
  - value: research-da-ref-building
    label: "업무시설의 에너지 기여도 기반 대표형상 건물(Reference Building) 도출 프레임워"
  - value: research-da-thermal-seat
    label: "열적 특성 기반의 개인 맞춤형 좌석 선택 시스템 제안"
  - value: research-da-ubem-pattern
    label: "UBEM 에너지 사용 패턴 보정"
  - value: research-da-urban-load
    label: "도시 에너지 부하 평탄화"
  - value: research-elevator
    label: "엘리베이터 샤프트 내 균일 냉각을 위한 급배기 위치 최적화"
  - value: research-pmv-sensor
    label: "도서관 최적 좌석 제시를 위한 PMV 가상센서 시스템 구축"
  - value: research-sample-size
    label: "최소 샘플 크기 추정"
  - value: research-um-dbem
    label: "Load Sharing Community 조성을 위한 District Building Ener"
  - value: research-um-ubem
    label: "도시 단위 건물 에너지 해석을 위한 건물 특성 지표 및 도시 건물 에너지 모델(UBEM) 개발"
  - value: research-whr-dc
    label: "데이터센터 폐열을 활용한 급탕 및 수열원 온도 유지 방안"
  - value: research-zeb-economy
    label: "ZEB 에너지 사용량, 경제성 분석"

media:
  - name: news_images
    label: News 사진
    input: News_Blog_JPG/beelab_images/News
    output: News_Blog_JPG/beelab_images/News
    extensions: [jpg, jpeg, png, webp]
  - name: blog_images
    label: Blog 사진
    input: News_Blog_JPG/beelab_images/Blog
    output: News_Blog_JPG/beelab_images/Blog
    extensions: [jpg, jpeg, png, webp]

content:
  - name: news
    label: News
    type: file
    path: News_Blog_JPG/beelab_content/news.json
    format: json
    list: true
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: date
        label: 날짜 (최신이 위로 정렬됨)
        type: date
        options:
          format: yyyy-MM-dd
      - name: body
        label: 본문
        type: text
      - name: images
        label: 사진 (여러 장 가능, 첫 장이 대표 이미지)
        type: object
        list: true
        fields:
          - name: src
            label: 사진
            type: image
            options:
              media: news_images
          - name: caption
            label: 설명글 (선택)
            type: string
  - name: blog
    label: Blog
    type: file
    path: News_Blog_JPG/beelab_content/blog.json
    format: json
    list: true
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: date
        label: 날짜 (최신이 위로 정렬됨)
        type: date
        options:
          format: yyyy-MM-dd
      - name: body
        label: 본문
        type: text
      - name: images
        label: 사진 (여러 장 가능, 첫 장이 대표 이미지)
        type: object
        list: true
        fields:
          - name: src
            label: 사진
            type: image
            options:
              media: blog_images
          - name: caption
            label: 설명글 (선택)
            type: string
  - name: pub-international
    label: International Publications (국제 저널)
    type: file
    path: publications/international.json
    format: json
    list: true
    fields:
      - name: citation
        label: 인용문 (Google Scholar 의 Cite → APA 를 그대로 붙여넣기)
        type: text
        required: true
        options:
          description: '예: Lee, S., Lim, H., & Kim, I. (2026). Load separation method for enhancing performance of central heat pump water heater. Energy and Buildings, 348, 116501.'
      - name: date
        label: 날짜 (연도로 묶이고 같은 해에선 최신순 자동 정렬)
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: doi
        label: 'DOI (선택). 반드시 https://doi.org/10.... 형태로 넣으세요. 저널 사이트 주소는 링크가 안 열립니다'
        type: string
      - name: badge
        label: 배지 (비워두면 SCIE 자동)
        type: select
        options:
          multiple: false
          values:
            - SCIE
            - SCOPUS
            - KCI
      - name: members
        label: 연구실 공저자 (제1저자는 넣지 않음. 비워두면 자동으로 채워짐)
        type: select
        options:
          multiple: true
          values: *LAB_MEMBERS
      - name: research
        label: 관련 연구 주제 (고르면 그 연구 상세 페이지에 자동으로 표시됨)
        type: select
        options:
          multiple: true
          values: *RESEARCH_PAGES
      - name: award
        label: 수상 (상장에 적힌 이름 그대로. 해당 없으면 비워둘 것)
        type: select
        options:
          multiple: false
          values:
            - 우수논문상
            - 우수논문발표상
  - name: pub-domestic
    label: Domestic Publications (국내 저널)
    type: file
    path: publications/domestic.json
    format: json
    list: true
    fields:
      - name: citation
        label: 인용문 (Google Scholar 의 Cite → APA 를 그대로 붙여넣기)
        type: text
        required: true
        options:
          description: '예: 황정윤, 김덕우, 임현우. (2026). 건물 에너지 분석을 위한 공공데이터 기반 건축물 분류. 대한건축학회 논문집, 42(6), 283-290.'
      - name: date
        label: 날짜 (연도로 묶이고 같은 해에선 최신순 자동 정렬)
        type: date
