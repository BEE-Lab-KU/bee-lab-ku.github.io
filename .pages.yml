media:
  - name: news_images
    label: News 사진
    input: News_Blog_JPG/beelab_images/News
    output: News_Blog_JPG/beelab_images/News
    extensions: [jpg, jpeg, png, webp]
  - name: blog_images
    label: Blog 사진
    input: News_Blog_JPG/beelab_images/Blog
    output: News_Blog_JPG/beelab_images/Blog
    extensions: [jpg, jpeg, png, webp]
  - name: research_figs
    label: 연구 대표 그림
    input: Photos/research-figs
    output: Photos/research-figs
    extensions: [jpg, jpeg, png, webp]

content:
  - name: news
    label: News
    type: file
    path: News_Blog_JPG/beelab_content/news.json
    format: json
    list: true
    fields:
      - name: id
        type: uuid
        hidden: true
      - name: title
        label: 제목
        type: string
        required: true
        description: '연도로 시작하세요. 예. 2025 대한설비공학회 동계학술발표대회, 2025 제13회 HVAC 경진대회 장려상 수상. 따옴표와 대괄호는 쓰지 않습니다. 학회명과 행사명은 공식 표기(대소문자, 띄어쓰기)를 따릅니다. 연구실 이름은 BEE Lab으로 씁니다. BEE LAB, Bee_LAB, BEE Lab.처럼 쓰면 배포가 막힙니다(문장 끝 마침표는 괜찮습니다).'
      - name: titleEn
        label: 영문 제목
        type: string
        required: true
        description: '한글 제목처럼 연도로 시작하세요. 예. 2025 SAREK Winter Annual Conference. 한글 제목과 함께 검토한 뒤 저장하세요. 영문이 없으면 사이트가 배포되지 않습니다.'
      - name: date
        label: 날짜 (최신이 위로 정렬됨)
        type: date
        description: 실제 행사 날짜를 입력하세요. 목록 순서와 상세 화면 날짜에 그대로 쓰입니다.
        options:
          format: yyyy-MM-dd
      - name: location
        label: 장소 (선택)
        type: string
        description: 학회와 행사 글에 입력하세요. 해외는 "도시, 국가"(예. 프라하, 체코), 국내는 도시(예. 제주). 사이트에는 날짜 옆에 @와 함께 표시됩니다. @는 직접 쓰지 마세요.
      - name: locationEn
        label: 영문 장소 (선택)
        type: string
        description: 한글 장소를 입력했으면 영문도 입력해야 합니다. 해외는 "City, Country"(예. Prague, Czech Republic), 국내는 "City, South Korea"(예. Jeju, South Korea).
      - name: body
        label: 본문
        type: text
        description: 연구실 이름은 BEE Lab으로 씁니다. BEE LAB, Bee_LAB, BEE Lab.처럼 쓰면 배포가 막힙니다(문장 끝 마침표는 괜찮습니다).
      - name: bodyEn
        label: 영문 본문
        type: text
        description: 한글 본문이 있으면 영문도 입력해야 합니다. 본문 없는 사진 글은 비워도 됩니다.
      - name: images
        label: 사진 (여러 장 가능, 첫 장이 대표 이미지)
        type: object
        list: true
        fields:
          - name: src
            label: 사진
            type: image
            options:
              media: news_images
          - name: caption
            label: 설명글 (선택)
            type: string
          - name: captionEn
            label: 영문 설명글 (선택)
            type: string
            description: 한글 설명글이 있으면 영문도 입력해야 합니다.
  - name: blog
    label: Blog
    type: file
    path: News_Blog_JPG/beelab_content/blog.json
    format: json
    list: true
    fields:
      - name: id
        type: uuid
        hidden: true
      - name: title
        label: 제목
        type: string
        required: true
        description: '연도를 넣을 때는 맨 앞에 씁니다. 예. 2025 송년회. 연구실 이름은 BEE Lab으로 씁니다. BEE LAB, Bee_LAB, BEE Lab.처럼 쓰면 배포가 막힙니다(문장 끝 마침표는 괜찮습니다).'
