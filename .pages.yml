media:
  - name: news_images
    label: News 사진
    input: News_Blog_JPG/beelab_images/News
    output: News_Blog_JPG/beelab_images/News
    extensions: [jpg, jpeg, png, webp]
  - name: blog_images
    label: Blog 사진
    input: News_Blog_JPG/beelab_images/Blog
    output: News_Blog_JPG/beelab_images/Blog
    extensions: [jpg, jpeg, png, webp]

content:
  - name: news
    label: News
    type: file
    path: News_Blog_JPG/beelab_content/news.json
    format: json
    list: true
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: date
        label: 날짜 (최신이 위로 정렬됨)
        type: date
        options:
          format: yyyy-MM-dd
      - name: body
        label: 본문
        type: text
      - name: images
        label: 사진 (여러 장 가능, 첫 장이 대표 이미지)
        type: object
        list: true
        fields:
          - name: src
            label: 사진
            type: image
            options:
              media: news_images
          - name: caption
            label: 설명글 (선택)
            type: string
  - name: blog
    label: Blog
    type: file
    path: News_Blog_JPG/beelab_content/blog.json
    format: json
    list: true
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: date
        label: 날짜 (최신이 위로 정렬됨)
        type: date
        options:
          format: yyyy-MM-dd
      - name: body
        label: 본문
        type: text
      - name: images
        label: 사진 (여러 장 가능, 첫 장이 대표 이미지)
        type: object
        list: true
        fields:
          - name: src
            label: 사진
            type: image
            options:
              media: blog_images
          - name: caption
            label: 설명글 (선택)
            type: string
  - name: publications
    label: Publications
    type: file
    path: publications.json
    format: json
    list: true
    fields:
      - name: category
        label: 종류 (탭 선택)
        type: select
        required: true
        options:
          multiple: false
          values:
            - value: international
              label: International Publication (국제 논문)
            - value: domestic
              label: Domestic Publication (국내 논문)
            - value: int-conf
              label: International Conference (국제 학회)
            - value: dom-conf
              label: Domestic Conference (국내 학회)
      - name: date
        label: 날짜 (발표일/게재일 · 이 날짜의 연도로 묶이고 같은 해에선 최신순 자동 정렬)
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: title
        label: 제목 (저자 포함, 예 "Lee, S., ... Load separation method ...")
        type: text
        required: true
      - name: venue
        label: 저널명 / 학회명
        type: string
      - name: doi
        label: DOI / 링크 (선택)
        type: string
      - name: badge
        label: 배지 (국제논문 SCIE / 국내논문 KCI / 학회 CONF)
        type: select
        options:
          multiple: false
          values:
            - SCIE
            - KCI
            - CONF
      - name: award
        label: 우수논문발표상 수상 (체크하면 🏆 우수논문발표상 표시)
        type: boolean
